name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run zip
      - uses: actions/upload-artifact@v4
        with:
          name: sendpulse-gmail
          path: sendpulse-gmail.zip
      - run: npm run zip:firefox
      - run: npx -y web-ext@8 lint --source-dir dist-firefox --self-hosted=false
      - uses: actions/upload-artifact@v4
        with:
          name: sendpulse-gmail-firefox
          path: sendpulse-gmail-firefox.zip
